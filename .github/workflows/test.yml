name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PG_VERSION: 18

    steps:
      - uses: actions/checkout@v6

      - name: Add PGDG repository
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update

      - name: Install PostgreSQL ${{ env.PG_VERSION }} and pgTAP
        run: sudo apt-get install -y postgresql-${{ env.PG_VERSION }} postgresql-${{ env.PG_VERSION }}-pgtap

      - name: Configure and start PostgreSQL ${{ env.PG_VERSION }}
        run: |
          sudo service postgresql stop || true
          sudo pg_createcluster ${{ env.PG_VERSION }} main
          echo "port = 5432" | sudo tee -a /etc/postgresql/${{ env.PG_VERSION }}/main/postgresql.conf > /dev/null
          sudo sed -i '1i local all all trust' /etc/postgresql/${{ env.PG_VERSION }}/main/pg_hba.conf
          sudo pg_ctlcluster ${{ env.PG_VERSION }} main start

      - name: Load schema
        run: make setup
        env:
          PGUSER: postgres

      - name: Run tests
        run: make test
        env:
          PGUSER: postgres
