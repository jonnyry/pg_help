name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg_version: [14, 15, 16, 17, 18]
      fail-fast: false
      
    steps:
      - uses: actions/checkout@v6

      - name: Add PGDG repository
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update

      - name: Install PostgreSQL ${{ matrix.pg_version }} and plpgsql_check
        run: sudo apt-get install -y postgresql-${{ matrix.pg_version }} postgresql-${{ matrix.pg_version }}-plpgsql-check

      - name: Configure and start PostgreSQL ${{ matrix.pg_version }}
        run: |
          sudo service postgresql stop || true
          sudo pg_dropcluster --stop ${{ matrix.pg_version }} main 2>/dev/null || true
          sudo pg_createcluster ${{ matrix.pg_version }} main
          echo "port = 5432" | sudo tee -a /etc/postgresql/${{ matrix.pg_version }}/main/postgresql.conf > /dev/null
          sudo sed -i '1i local all all trust' /etc/postgresql/${{ matrix.pg_version }}/main/pg_hba.conf
          sudo pg_ctlcluster ${{ matrix.pg_version }} main start

      - name: Load pg_describe
        run: psql -U postgres -f pg_describe.sql

      - name: Run linter
        run: make lint
        env:
          PGUSER: postgres
